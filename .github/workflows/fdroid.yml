name: Generate F-Droid Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fdroid-repo:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Install fdroidserver
        run: |
          sudo add-apt-repository -y ppa:fdroid/fdroidserver
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: 🩹 Patch androguard (tolerate non-zero res0/res1 fields)
        run: |
          sudo python3 - <<'EOF'
          path = "/usr/lib/python3/dist-packages/androguard/core/bytecodes/axml/__init__.py"
          with open(path) as f:
              lines = f.readlines()

          out = []
          changed = 0
          for line in lines:
              if 'raise ResParserError("res0 must be zero!")' in line:
                  out.append('            pass  # tolerate non-zero reserved field\n')
                  changed += 1
              elif 'raise ResParserError("res1 must be zero!")' in line:
                  out.append('            pass  # tolerate non-zero reserved field\n')
                  changed += 1
              else:
                  out.append(line)

          if changed != 2:
              raise SystemExit(
                  "ERROR: expected to patch res0/res1 ResParserError raises in %s, matched %d" % (path, changed)
              )

          with open(path, "w") as f:
              f.writelines(out)
          print("Patched androguard to tolerate non-zero res0/res1 reserved fields")
          EOF

      - name: 🔑 Restore signing keystore
        run: |
          mkdir -p fdroid
          echo "${{ secrets.FDROID_KEYSTORE_BASE64 }}" | base64 -d > fdroid/keystore.p12

      - name: 📝 Write F-Droid config
        run: |
          cat > fdroid/config.yml << 'EOF'
          repo_url: https://azumi0.github.io/Generic_Health_Connect_Workout_Merger/repo
          repo_name: Health Connect Workout Merger
          repo_description: >-
            F-Droid repository for Health Connect Workout Merger.
            Merge overlapping workout sessions from multiple fitness apps.
          repo_icon: icon.png
          archive_older: 0
          keystore: keystore.p12
          keystorepass: {env: FDROID_KEYSTORE_PASS}
          keypass: {env: FDROID_KEY_PASS}
          keydname: CN=F-Droid Repo, OU=F-Droid
          EOF
          chmod 600 fdroid/config.yml

      - name: 📥 Download Release APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p fdroid/repo
          gh release download --pattern "*.apk" --dir fdroid/repo || echo "No APK found in release"
          # Copy repo icon into the fdroid working dir (fdroidserver publishes it under repo/icons/)
          cp assets/icon.png fdroid/icon.png 2>/dev/null || true

      - name: 🤖 Build F-Droid Index
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        run: |
          cd fdroid
          repo_keyalias=$(keytool -list -keystore keystore.p12 -storetype PKCS12 -storepass "$FDROID_KEYSTORE_PASS" 2>/dev/null | awk -F', ' '/PrivateKeyEntry/ {print $1; exit}')
          if [ -z "$repo_keyalias" ]; then
            echo "::error::Failed to detect repo_keyalias from keystore.p12"
            keytool -list -keystore keystore.p12 -storetype PKCS12 -storepass "$FDROID_KEYSTORE_PASS" 2>&1 || true
            exit 1
          fi
          echo "repo_keyalias: $repo_keyalias" >> config.yml
          fdroid update --create-metadata --verbose

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          publish_branch: gh-pages
          force_orphan: true
